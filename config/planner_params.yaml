# Configuración del planificador global

global_planner_node:
  ros__parameters:
    # Radio de inflación de obstáculos en metros
    # Este valor determina el margen de seguridad alrededor de los obstáculos
    inflation_radius: 0.3
    
    # Topics del sistema
    map_topic: '/map'
    odom_topic: '/odom'
    goal_topic: '/goal_pose'
    path_topic: '/planned_path'
